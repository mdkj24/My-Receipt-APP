<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>差旅發票報帳小幫手 (純前端離線版)</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="差旅報帳通">
  <meta name="theme-color" content="#0F172A">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">

  <link rel="manifest" id="manifestPlaceholder">

  <!-- UI & Icon 資源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (Excel 匯出) -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <!-- Tesseract.js (純前端離線 OCR 引擎，免 API Key) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
      padding-top: env(safe-area-inset-top);
      -webkit-tap-highlight-color: transparent;
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    input, select, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-20 glass-nav border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow">
        <i class="fa-solid fa-receipt text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-slate-900">差旅發票報帳小幫手</h1>
        <p class="text-[11px] text-slate-500">離線 OCR 引擎 ‧ 免 API Key ‧ 匯出 Excel</p>
      </div>
    </div>
    <button onclick="toggleDebugConsole()" class="w-8 h-8 rounded-full bg-amber-100 text-amber-700 font-bold text-xs flex items-center justify-center" title="查看 OCR 辨識結果">
      <i class="fa-solid fa-terminal"></i>
    </button>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 p-4 max-w-lg mx-auto w-full space-y-4">

    <!-- 📷 相機拍攝區 -->
    <section class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg">
      <div class="inline-block px-2.5 py-0.5 bg-white/20 rounded-full text-[11px] font-semibold mb-2">
        🔒 100% 免費 ‧ 離線本地辨識 ‧ 無配額限制
      </div>
      <h2 class="text-lg font-bold mb-1">拍攝發票 / 費用單據</h2>
      <p class="text-blue-100 text-xs mb-4">拍照後手機將自動掃描文字，提取日期與金額。</p>
      
      <div class="flex gap-2">
        <label for="cameraInput" class="flex-1 bg-white text-blue-600 font-bold py-3.5 px-4 rounded-xl shadow active:bg-blue-50 transition flex items-center justify-center gap-2 text-sm text-center cursor-pointer">
          <i class="fa-solid fa-camera text-base"></i>
          <span id="camText">開啟相機拍照</span>
        </label>

        <label for="fileInput" class="bg-white/20 text-white font-semibold py-3.5 px-4 rounded-xl active:bg-white/30 transition flex items-center justify-center text-sm cursor-pointer">
          <i class="fa-solid fa-image text-base"></i>
        </label>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected(event)">
      <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelected(event)">
    </section>

    <!-- 🐛 Debug 終端機面板 (顯示原始 OCR 掃描出來的所有字串) -->
    <section id="debugSection" class="hidden bg-slate-900 text-emerald-400 rounded-2xl p-4 font-mono text-xs shadow space-y-2">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 text-slate-300">
        <span class="font-bold">OCR 掃描原始文字紀錄</span>
        <button onclick="clearLogs()" class="text-[10px] bg-slate-800 px-2 py-1 rounded">清空</button>
      </div>
      <div id="debugLogs" class="max-h-40 overflow-y-auto space-y-1 text-[11px] break-all"></div>
    </section>

    <!-- 📝 資料核對與編輯區 -->
    <section id="editArea" class="hidden bg-white rounded-2xl p-4 shadow border border-blue-200 space-y-3">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square text-blue-600"></i>
          <span>核對 / 修改 掃描結果</span>
        </h3>
        <button onclick="closeEditArea()" class="text-xs text-slate-400">關閉</button>
      </div>

      <div class="space-y-2 text-xs">
        <div>
          <label class="font-semibold text-slate-600 block mb-1">費用分類</label>
          <select id="inputCategory" class="w-full bg-slate-50 border rounded-xl p-2 font-medium">
            <option value="機票">機票</option>
            <option value="住宿">住宿</option>
            <option value="城市稅">城市稅</option>
            <option value="租車">租車</option>
            <option value="計程車">計程車</option>
            <option value="過路費">過路費</option>
            <option value="停車">停車</option>
            <option value="加油">加油</option>
            <option value="交際費">交際費</option>
            <option value="網卡">網卡</option>
            <option value="參展證">參展證</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-semibold text-slate-600 block mb-1">日期 (DAY)</label>
            <input type="date" id="inputDate" class="w-full bg-slate-50 border rounded-xl p-2">
          </div>
          <div>
            <label class="font-semibold text-slate-600 block mb-1">幣別</label>
            <select id="inputCurrency" onchange="autoCalcNTD()" class="w-full bg-slate-50 border rounded-xl p-2 font-bold">
              <option value="NTD">NTD</option>
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
              <option value="JPY">JPY</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-semibold text-slate-600 block mb-1">原幣金額 ($)</label>
            <input type="number" step="0.01" id="inputAmount" oninput="autoCalcNTD()" class="w-full bg-slate-50 border rounded-xl p-2 font-bold">
          </div>
          <div>
            <label class="font-semibold text-slate-600 block mb-1">卡號 / CASH</label>
            <input type="text" id="inputCardNo" placeholder="例: 1234 或 CASH" class="w-full bg-slate-50 border rounded-xl p-2">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-semibold text-slate-600 block mb-1">台幣折算 (NTD)</label>
            <input type="number" id="inputNtd" class="w-full bg-slate-50 border rounded-xl p-2 font-bold">
          </div>
          <div>
            <label class="font-semibold text-slate-600 block mb-1">TOTAL 金額</label>
            <input type="number" id="inputTotal" class="w-full bg-slate-50 border rounded-xl p-2 font-bold">
          </div>
        </div>

        <div>
          <label class="font-semibold text-slate-600 block mb-1">註 (備註)</label>
          <input type="text" id="inputNote" placeholder="例：午餐MAK" class="w-full bg-slate-50 border rounded-xl p-2">
        </div>
      </div>

      <button onclick="saveRecordFromArea()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">
        確認並新增至報帳列表
      </button>
    </section>

    <!-- 明細列表 -->
    <section class="space-y-2">
      <div class="flex items-center justify-between px-1">
        <h3 class="font-bold text-slate-700 text-sm">已登記報帳明細</h3>
        <button onclick="clearAll()" class="text-xs text-slate-400 hover:text-red-500">清空明細</button>
      </div>
      <div id="recordsContainer" class="space-y-2"></div>
    </section>

  </main>

  <!-- 底部固定匯出按鈕 -->
  <footer class="sticky bottom-0 z-20 glass-nav border-t border-slate-200 p-4 max-w-lg mx-auto w-full">
    <div class="flex items-center justify-between gap-3">
      <div>
        <div class="text-[11px] text-slate-400">總計筆數</div>
        <div id="totalCount" class="text-lg font-bold text-slate-900">0 筆</div>
      </div>
      <button onclick="exportToExcel()" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 px-5 rounded-xl shadow text-sm flex items-center gap-2">
        <i class="fa-solid fa-file-excel"></i>
        <span>匯出 Excel 報帳表</span>
      </button>
    </div>
  </footer>

  <script>
    let records = JSON.parse(localStorage.getItem('receipt_records_v5') || '[]');
    let editingId = null;
    let tesseractWorker = null;

    function logDebug(msg, type = 'info') {
      const logs = document.getElementById('debugLogs');
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = type === 'error' ? 'text-red-400 font-bold' : (type === 'warn' ? 'text-amber-300' : 'text-emerald-400');
      div.innerText = `[${time}] ${msg}`;
      logs.appendChild(div);
      logs.scrollTop = logs.scrollHeight;
    }

    function toggleDebugConsole() {
      document.getElementById('debugSection').classList.toggle('hidden');
    }
    function clearLogs() {
      document.getElementById('debugLogs').innerHTML = '';
    }

    (function setupPWA() {
      const manifest = {
        name: "差旅發票報帳小幫手",
        short_name: "差旅報帳通",
        start_url: "./",
        display: "standalone",
        background_color: "#F2F2F7",
        theme_color: "#0F172A",
        icons: [{ src: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png", sizes: "512x512", type: "image/png" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      document.getElementById('manifestPlaceholder').setAttribute('href', URL.createObjectURL(blob));
    })();

    window.addEventListener('DOMContentLoaded', () => {
      renderRecords();
      logDebug("離線模式已就緒，無須連線與 API Key。");
    });

    // ⚡ ⭐ 核心：純前端 Tesseract.js OCR 文字掃描與 RegEx 自動匹配
    async function handleFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      const btnText = document.getElementById('camText');
      btnText.innerText = "手機本地掃描中...";

      try {
        logDebug("開始載入本地 OCR 引擎 (繁體中文+英文)...");

        if (!tesseractWorker) {
          tesseractWorker = await Tesseract.createWorker('chi_tra+eng');
        }

        logDebug("正在分析圖片中的文字與數字...");
        const ret = await tesseractWorker.recognize(file);
        const text = ret.data.text;

        logDebug("--- OCR 辨識出的文字原始內容 ---");
        logDebug(text);
        logDebug("-------------------------------");

        // 1. 自動匹配日期 (RegEx 尋找 YYYY-MM-DD 或 YYYY/MM/DD)
        let detectedDate = new Date().toISOString().split('T')[0];
        const dateMatch = text.match(/\b(20\d{2})[-/.](0?[1-9]|1[0-2])[-/.](0?[1-9]|[12]\d|3[01])\b/);
        if (dateMatch) {
          const y = dateMatch[1];
          const m = dateMatch[2].padStart(2, '0');
          const d = dateMatch[3].padStart(2, '0');
          detectedDate = `${y}-${m}-${d}`;
          logDebug(`匹配到日期: ${detectedDate}`);
        }

        // 2. 自動匹配金額 (尋找 $、EUR、NTD 或數字組合)
        let detectedAmount = 0;
        const amountMatches = [...text.matchAll(/(?:NTD|EUR|USD|\$|總計|金額|TOTAL)\s*[:：]?\s*([0-9,]+(?:\.[0-9]{1,2})?)/gi)];
        if (amountMatches.length > 0) {
          // 取最後一個出現的匹配金額 (發票總額通常在下方)
          const lastMatch = amountMatches[amountMatches.length - 1][1];
          detectedAmount = parseFloat(lastMatch.replace(/,/g, '')) || 0;
          logDebug(`匹配到金額: $${detectedAmount}`);
        } else {
          // 若無特徵詞，尋找較大的純數字
          const pureNumbers = text.match(/\b\d{2,6}(?:\.\d{2})?\b/g);
          if (pureNumbers) {
            const numArr = pureNumbers.map(n => parseFloat(n)).filter(n => !isNaN(n));
            detectedAmount = Math.max(...numArr, 0);
            logDebug(`自動提取較大數字金額: $${detectedAmount}`);
          }
        }

        // 3. 自動匹配幣別
        let detectedCurrency = 'NTD';
        if (/EUR|€/i.test(text)) detectedCurrency = 'EUR';
        else if (/USD|\$/i.test(text)) detectedCurrency = 'USD';
        else if (/JPY|￥/i.test(text)) detectedCurrency = 'JPY';

        // 計算 NTD 金額
        const rates = { NTD: 1, EUR: 35, USD: 32, JPY: 0.22 };
        const rate = rates[detectedCurrency] || 1;
        const calculatedNtd = detectedCurrency === 'NTD' ? detectedAmount : Math.round(detectedAmount * rate);

        showEditArea({
          date: detectedDate,
          category: '其他',
          currency: detectedCurrency,
          amount: detectedAmount,
          cardNo: '',
          ntd: calculatedNtd,
          total: calculatedNtd,
          note: ''
        });

      } catch (err) {
        logDebug(`OCR 處理失敗: ${err.message}`, "error");
        alert("照片處理失敗：\n" + err.message);
      } finally {
        btnText.innerText = "開啟相機拍照";
        e.target.value = '';
      }
    }

    function autoCalcNTD() {
      const curr = document.getElementById('inputCurrency').value;
      const amt = parseFloat(document.getElementById('inputAmount').value) || 0;
      const rates = { NTD: 1, EUR: 35, USD: 32, JPY: 0.22 };
      const ntd = curr === 'NTD' ? amt : Math.round(amt * (rates[curr] || 1));
      document.getElementById('inputNtd').value = ntd;
      document.getElementById('inputTotal').value = ntd;
    }

    function showEditArea(data = null) {
      document.getElementById('editArea').classList.remove('hidden');
      if (data) {
        document.getElementById('inputCategory').value = data.category || '其他';
        document.getElementById('inputDate').value = data.date || new Date().toISOString().split('T')[0];
        document.getElementById('inputCurrency').value = data.currency || 'NTD';
        document.getElementById('inputAmount').value = data.amount || 0;
        document.getElementById('inputCardNo').value = data.cardNo || '';
        document.getElementById('inputNtd').value = data.ntd || 0;
        document.getElementById('inputTotal').value = data.total || 0;
        document.getElementById('inputNote').value = data.note || '';
      }
      document.getElementById('editArea').scrollIntoView({ behavior: 'smooth' });
    }

    function closeEditArea() {
      document.getElementById('editArea').classList.add('hidden');
      editingId = null;
    }

    function saveRecordFromArea() {
      const item = {
        id: editingId || Date.now().toString(),
        category: document.getElementById('inputCategory').value,
        date: document.getElementById('inputDate').value,
        currency: document.getElementById('inputCurrency').value,
        amount: parseFloat(document.getElementById('inputAmount').value) || 0,
        cardNo: document.getElementById('inputCardNo').value.trim(),
        ntd: parseFloat(document.getElementById('inputNtd').value) || 0,
        total: parseFloat(document.getElementById('inputTotal').value) || 0,
        note: document.getElementById('inputNote').value.trim()
      };

      if (editingId) {
        const idx = records.findIndex(r => r.id === editingId);
        if (idx !== -1) records[idx] = item;
      } else {
        records.push(item);
      }

      localStorage.setItem('receipt_records_v5', JSON.stringify(records));
      renderRecords();
      closeEditArea();
    }

    function renderRecords() {
      const container = document.getElementById('recordsContainer');
      document.getElementById('totalCount').innerText = `${records.length} 筆`;

      if (records.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-xl p-6 text-center text-slate-400 text-xs border border-dashed">尚未登記任何明細</div>`;
        return;
      }

      container.innerHTML = records.map((r, i) => `
        <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 flex items-center justify-between text-xs">
          <div>
            <div class="font-bold text-slate-800">#${i+1} [${r.category}] ${r.currency} $${r.amount}</div>
            <div class="text-slate-400 mt-0.5">${r.date} ‧ 付款: ${r.cardNo || '無'} ‧ 註: ${r.note || '無'}</div>
          </div>
          <div class="text-right">
            <div class="font-extrabold text-slate-900">NTD ${r.ntd}</div>
            <button onclick="removeRecord('${r.id}')" class="text-red-500 font-semibold text-[10px] mt-1">刪除</button>
          </div>
        </div>
      `).join('');
    }

    function removeRecord(id) {
      if (confirm('確定刪除？')) {
        records = records.filter(r => r.id !== id);
        localStorage.setItem('receipt_records_v5', JSON.stringify(records));
        renderRecords();
      }
    }

    function clearAll() {
      if (records.length && confirm('確定清空？')) {
        records = [];
        localStorage.setItem('receipt_records_v5', JSON.stringify(records));
        renderRecords();
      }
    }

    function exportToExcel() {
      if (!records.length) return alert('無資料可匯出！');
      const data = records.map((r, i) => ({
        "項次": i + 1,
        "DAY": r.date,
        "分類": r.category,
        "幣別": r.currency,
        "$": r.amount,
        "刷卡金額": r.amount,
        "卡號": r.cardNo,
        "NTD": r.ntd,
        "TOTAL": r.total,
        "註": r.note,
        "Check": ""
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      ws['!cols'] = [{ wch: 6 }, { wch: 12 }, { wch: 10 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 20 }, { wch: 8 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "差旅核銷表");
      XLSX.writeFile(wb, `差旅報帳明細表_${new Date().toISOString().split('T')[0]}.xlsx`);
    }
  </script>
</body>
</html>
