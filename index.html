<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>差旅發票報帳小幫手 (Debug 版)</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="差旅報帳通">
  <meta name="theme-color" content="#0F172A">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">

  <link rel="manifest" id="manifestPlaceholder">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
      padding-top: env(safe-area-inset-top);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 glass-nav border-b border-slate-200/80 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center shadow-md">
        <i class="fa-solid fa-receipt text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-slate-900 leading-tight">差旅發票報帳小幫手</h1>
        <p class="text-xs text-slate-500">Gemini 1.5 Flash 辨識 ‧ 匯出 Excel</p>
      </div>
    </div>
    <div class="flex items-center gap-1">
      <button onclick="toggleDebugConsole()" class="w-9 h-9 rounded-full bg-amber-100 hover:bg-amber-200 transition flex items-center justify-center text-amber-700 font-bold text-xs" title="查看 Debug 日誌">
        <i class="fa-solid fa-bug"></i>
      </button>
      <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 transition flex items-center justify-center text-slate-600">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 p-4 max-w-lg mx-auto w-full space-y-4">

    <!-- 拍照卡片 -->
    <section class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl p-5 text-white shadow-xl shadow-blue-500/10">
      <div class="inline-block px-2.5 py-0.5 bg-white/20 rounded-full text-[11px] font-semibold backdrop-blur-md mb-2">
        ✨ Google Gemini 視覺 AI 驅動
      </div>
      <h2 class="text-xl font-bold mb-1">拍攝發票 / 收據照片</h2>
      <p class="text-blue-100 text-xs mb-4">拍照後 AI 自動識別日期、幣別、分類與金額。</p>
      
      <div class="flex gap-2">
        <button id="camBtn" onclick="triggerCamera()" class="flex-1 bg-white text-blue-600 font-bold py-3 px-4 rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-camera text-base"></i>
          <span id="camBtnText">開啟相機拍照</span>
        </button>
        <button onclick="triggerFileSelect()" class="bg-white/20 hover:bg-white/30 text-white font-semibold py-3 px-3 rounded-xl active:scale-95 transition flex items-center justify-center text-sm">
          <i class="fa-solid fa-image text-base"></i>
        </button>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected(event)">
      <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelected(event)">
    </section>

    <!-- 🛠️ 內建 Debug 訊息視窗 (點上方 🐛 蟲蟲圖示開啟/關閉) -->
    <section id="debugSection" class="hidden bg-slate-900 text-emerald-400 rounded-2xl p-4 font-mono text-xs shadow-lg space-y-2 border border-slate-700">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 text-slate-300">
        <span class="font-bold flex items-center gap-1.5">
          <i class="fa-solid fa-terminal text-amber-400"></i>
          <span>即時除錯日誌 (Debug Logs)</span>
        </span>
        <button onclick="clearLogs()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded">清空紀錄</button>
      </div>
      <div id="debugLogs" class="max-h-48 overflow-y-auto space-y-1 text-[11px] leading-relaxed break-all">
        <div class="text-slate-500">> 系統初始化完成，等待拍照觸發...</div>
      </div>
    </section>

    <!-- 明細列表 -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h3 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
          <span>待報帳明細</span>
          <span id="recordCountBadge" class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
        </h3>
        <button onclick="clearAllRecords()" class="text-xs text-slate-400 hover:text-red-500 font-medium transition">
          <i class="fa-regular fa-trash-can mr-1"></i>清空
        </button>
      </div>

      <div id="receiptListContainer" class="space-y-2.5"></div>
    </section>

  </main>

  <!-- 底部列 -->
  <footer class="sticky bottom-0 z-30 glass-nav border-t border-slate-200/80 p-4 max-w-lg mx-auto w-full">
    <div class="flex items-center justify-between gap-3">
      <div>
        <div class="text-[11px] text-slate-400 font-medium">總計筆數</div>
        <div id="totalCountText" class="text-xl font-extrabold text-slate-900">0 筆</div>
      </div>
      <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-5 rounded-2xl shadow-lg shadow-emerald-600/20 active:scale-95 transition flex items-center gap-2 text-sm">
        <i class="fa-solid fa-file-excel text-base"></i>
        <span>匯出 Excel 報帳表</span>
      </button>
    </div>
  </footer>

  <!-- 編輯彈窗 -->
  <div id="editModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base">核對 / 修改 AI 辨識資料</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">費用分類</label>
          <select id="inputCategory" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 outline-none">
            <option value="機票">機票</option>
            <option value="住宿">住宿</option>
            <option value="城市稅">城市稅</option>
            <option value="租車">租車</option>
            <option value="計程車">計程車</option>
            <option value="過路費">過路費</option>
            <option value="停車">停車</option>
            <option value="加油">加油</option>
            <option value="交際費">交際費</option>
            <option value="網卡">網卡</option>
            <option value="參展證">參展證</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">日期 (DAY)</label>
            <input type="date" id="inputDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">幣別</label>
            <select id="inputCurrency" onchange="autoCalculateNTD()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 outline-none">
              <option value="NTD">NTD</option>
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
              <option value="JPY">JPY</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">原幣金額 ($)</label>
            <input type="number" step="0.01" id="inputAmount" oninput="autoCalculateNTD()" placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">卡號 / 付款方式</label>
            <input type="text" id="inputCardNo" placeholder="例: 1234 或 CASH" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">台幣換算 (NTD)</label>
            <input type="number" id="inputNtd" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">TOTAL 金額</label>
            <input type="number" id="inputTotal" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">註 (備註說明)</label>
          <input type="text" id="inputNote" placeholder="例：午餐MAK / 無單據" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 outline-none">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">取消</button>
        <button onclick="saveRecord()" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">儲存項目</button>
      </div>
    </div>
  </div>

  <!-- API Key 設定彈窗 -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-800 text-base border-b pb-2">設定 Gemini API Key</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Google Gemini API Key</label>
          <input type="text" id="apiKeyInput" placeholder="貼上 AIzaSy... 開頭的金鑰" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono outline-none">
          <p class="text-[10px] text-slate-400 mt-1">金鑰僅會儲存在您的手機瀏覽器中。</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="closeSettingsModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-xl text-xs">取消</button>
        <button onclick="saveSettings()" class="flex-1 bg-slate-800 text-white font-bold py-2 rounded-xl text-xs">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 核心邏輯與完整 Debug 監控機制 -->
  <script>
    let records = JSON.parse(localStorage.getItem('receipt_records_v3') || '[]');
    let currentEditingId = null;

    // 🛠️ Log 寫入函數
    function logDebug(msg, type = 'info') {
      const logs = document.getElementById('debugLogs');
      const time = new Date().toLocaleTimeString();
      let colorClass = 'text-emerald-400';
      if (type === 'error') colorClass = 'text-red-400 font-bold';
      if (type === 'warn') colorClass = 'text-amber-300';
      
      const newLog = document.createElement('div');
      newLog.className = colorClass;
      newLog.innerText = `[${time}] ${msg}`;
      logs.appendChild(newLog);
      logs.scrollTop = logs.scrollHeight;

      // 當有 Error 時自動展開 Debug 面板
      if (type === 'error') {
        document.getElementById('debugSection').classList.remove('hidden');
      }
    }

    function toggleDebugConsole() {
      document.getElementById('debugSection').classList.toggle('hidden');
    }

    function clearLogs() {
      document.getElementById('debugLogs').innerHTML = '<div class="text-slate-500">> 日誌已清空...</div>';
    }

    // PWA Manifest
    (function setupPWA() {
      const manifest = {
        name: "差旅發票報帳小幫手",
        short_name: "差旅報帳通",
        start_url: "./",
        display: "standalone",
        background_color: "#F2F2F7",
        theme_color: "#0F172A",
        icons: [{ src: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png", sizes: "512x512", type: "image/png" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      document.getElementById('manifestPlaceholder').setAttribute('href', URL.createObjectURL(blob));
    })();

    window.addEventListener('DOMContentLoaded', () => {
      renderRecords();
      const savedKey = localStorage.getItem('ocr_apikey') || '';
      document.getElementById('apiKeyInput').value = savedKey;

      if (savedKey) {
        logDebug(`已讀取存儲的金鑰: ${savedKey.substring(0, 8)}... (長度: ${savedKey.length})`);
      } else {
        logDebug("未發現設定的金鑰，請先點擊右上角齒輪設定 API Key。", "warn");
      }
    });

    function triggerCamera() { document.getElementById('cameraInput').click(); }
    function triggerFileSelect() { document.getElementById('fileInput').click(); }

    // 🖼️ 圖片壓縮小工具
    function compressImage(file, maxWidth) {
      return new Promise((resolve, reject) => {
        logDebug(`正在讀取原始照片: ${file.name} (${Math.round(file.size / 1024)} KB)`);
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          const base64Str = dataUrl.split(',')[1];
          logDebug(`圖片已壓縮為: ${width}x${height} (${Math.round(base64Str.length / 1024)} KB)`);
          resolve(base64Str);
        };
        img.onerror = (err) => {
          logDebug("圖片壓縮失敗！", "error");
          reject(err);
        };
      });
    }

    // ⚡ ⭐ 帶有完整 Debug 捕捉的 API 發送邏輯
    async function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const apiKey = localStorage.getItem('ocr_apikey')?.trim();
      if (!apiKey) {
        logDebug("用戶發起拍照，但 LocalStorage 中無 API Key！", "error");
        alert("【尚未設定 API Key】\n請點擊右上角齒輪設定，貼上您的 Gemini API Key！");
        openSettingsModal();
        event.target.value = '';
        return;
      }

      logDebug(`準備發送請求至 Gemini API，使用的 Key: ${apiKey.substring(0, 6)}...`);

      const btnText = document.getElementById('camBtnText');
      const originalText = btnText ? btnText.innerText : '開啟相機拍照';
      if (btnText) btnText.innerText = "圖片處理與 AI 辨識中...";

      try {
        // 1. 圖片壓縮
        const base64Image = await compressImage(file, 1200);

        // 2. 發送至 Google Gemini 1.5 Flash API
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        logDebug(`正在請求 URL: https://generativelanguage.googleapis.com/...`);

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { 
                  text: '請分析這張發票/收據照片，提取資訊並直接輸出嚴格的 JSON 格式（絕對不要包含 markdown ```json 標籤）：' +
                        '{"date":"YYYY-MM-DD","category":"機票/住宿/城市稅/租車/計程車/過路費/停車/加油/交際費/網卡/參展證/其他","currency":"NTD/EUR/USD/JPY","amount":0.00,"cardNo":"卡號末四碼或CASH","note":"備註或明細說明"}' 
                },
                { inline_data: { mime_type: 'image/jpeg', data: base64Image } }
              ]
            }]
          })
        });

        logDebug(`HTTP 回應狀態碼: ${response.status} ${response.statusText}`);

        const resData = await response.json();

        // 判斷 API 回傳錯誤
        if (resData.error) {
          logDebug(`API 錯誤細節: [Code ${resData.error.code}] ${resData.error.message}`, "error");
          if (resData.error.status) logDebug(`Status: ${resData.error.status}`, "error");
          throw new Error(`[Google API 錯誤 ${resData.error.code}]: ${resData.error.message}`);
        }

        if (!resData.candidates || !resData.candidates[0]) {
          logDebug("API 未回應候選答案： " + JSON.stringify(resData), "error");
          throw new Error("AI 未能從圖片中識別出文字。");
        }

        // 3. 解析 AI 回傳的文字
        let rawText = resData.candidates[0].content.parts[0].text.trim();
        logDebug(`AI 原始回傳內容: ${rawText}`);

        rawText = rawText.replace(/
