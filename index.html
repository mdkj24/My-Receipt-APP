<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>差旅發票報帳小幫手</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="差旅報帳通">
  <meta name="theme-color" content="#0F172A">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">

  <link rel="manifest" id="manifestPlaceholder">

  <!-- UI & Icon 資源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (Excel 匯出) -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
      padding-top: env(safe-area-inset-top);
      -webkit-tap-highlight-color: transparent;
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    input, select, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-20 glass-nav border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow">
        <i class="fa-solid fa-pen-to-square text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-slate-900">差旅發票報帳小幫手</h1>
        <p class="text-[11px] text-slate-500">依刷卡帳單實報 ‧ 匯出 Excel</p>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 p-4 max-w-lg mx-auto w-full space-y-4">

    <!-- ✍️ 報帳輸入面板 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <div class="flex items-center justify-between border-b pb-2">
        <h2 class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
          <i class="fa-solid fa-plus text-blue-600"></i>
          <span>新增發票 / 費用明細</span>
        </h2>
        <span class="text-[10px] bg-blue-50 text-blue-600 font-semibold px-2 py-0.5 rounded-full">依刷卡單實報</span>
      </div>

      <form id="entryForm" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="font-semibold text-slate-600 block mb-1">費用分類</label>
          <select id="inputCategory" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-medium outline-none focus:ring-2 focus:ring-blue-500">
            <option value="機票">機票</option>
            <option value="住宿">住宿</option>
            <option value="城市稅">城市稅</option>
            <option value="租車">租車</option>
            <option value="計程車">計程車</option>
            <option value="過路費">過路費</option>
            <option value="停車">停車</option>
            <option value="加油">加油</option>
            <option value="交際費">交際費</option>
            <option value="網卡">網卡</option>
            <option value="參展證">參展證</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-semibold text-slate-600 block mb-1">日期 (DAY)</label>
            <input type="date" id="inputDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-medium outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="font-semibold text-slate-600 block mb-1">幣別</label>
            <select id="inputCurrency" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold outline-none focus:ring-2 focus:ring-blue-500">
              <option value="NTD">NTD</option>
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
              <option value="JPY">JPY</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-semibold text-slate-600 block mb-1">原幣金額 ($)</label>
            <input type="number" step="0.01" id="inputAmount" placeholder="0.00" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-slate-900 outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="font-semibold text-slate-600 block mb-1">卡號 / CASH</label>
            <input type="text" id="inputCardNo" placeholder="例: 1234 或 CASH" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-medium outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- 💳 依據刷卡單實報的台幣金額區 -->
        <div class="bg-amber-50/60 p-3 rounded-xl border border-amber-200 space-y-2">
          <div class="text-[11px] font-bold text-amber-800 flex items-center gap-1">
            <i class="fa-solid fa-credit-card"></i>
            <span>帳單實扣台幣金額 (NTD / TOTAL)</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-semibold text-slate-600 block mb-1">台幣 NTD</label>
              <input type="number" id="inputNtd" oninput="syncTotalWithNtd()" placeholder="刷卡單台幣" class="w-full bg-white border border-slate-200 rounded-xl p-2 font-bold text-slate-900 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="font-semibold text-slate-600 block mb-1">TOTAL 金額</label>
              <input type="number" id="inputTotal" placeholder="刷卡單台幣" class="w-full bg-white border border-slate-200 rounded-xl p-2 font-bold text-slate-900 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <p class="text-[10px] text-amber-700 leading-tight">※ 若為 CASH (現金支付)，NTD 與 TOTAL 可留空或填 0。</p>
        </div>

        <div>
          <label class="font-semibold text-slate-600 block mb-1">註 (備註說明)</label>
          <input type="text" id="inputNote" placeholder="例：午餐MAK / 一半代墊Sam / 無單據" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-medium outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs shadow transition">
          ➕ 新增至報帳明細表
        </button>
      </form>
    </section>

    <!-- 📋 已登記列表 -->
    <section class="space-y-2">
      <div class="flex items-center justify-between px-1">
        <h3 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
          <span>待核銷明細</span>
          <span id="recordBadge" class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </h3>
        <button onclick="clearAll()" class="text-xs text-slate-400 hover:text-red-500 transition">清空所有</button>
      </div>

      <div id="recordsContainer" class="space-y-2"></div>
    </section>

  </main>

  <!-- 底部匯出按鈕 -->
  <footer class="sticky bottom-0 z-20 glass-nav border-t border-slate-200 p-4 max-w-lg mx-auto w-full">
    <div class="flex items-center justify-between gap-3">
      <div>
        <div class="text-[11px] text-slate-400">總計筆數</div>
        <div id="totalCount" class="text-lg font-bold text-slate-900">0 筆</div>
      </div>
      <button onclick="exportToExcel()" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 px-5 rounded-xl shadow text-sm flex items-center gap-2 transition">
        <i class="fa-solid fa-file-excel"></i>
        <span>匯出 Excel 報帳表</span>
      </button>
    </div>
  </footer>

  <script>
    let records = JSON.parse(localStorage.getItem('receipt_records_bill') || '[]');

    (function setupPWA() {
      const manifest = {
        name: "差旅發票報帳小幫手",
        short_name: "差旅報帳通",
        start_url: "./",
        display: "standalone",
        background_color: "#F2F2F7",
        theme_color: "#0F172A",
        icons: [{ src: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png", sizes: "512x512", type: "image/png" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      document.getElementById('manifestPlaceholder').setAttribute('href', URL.createObjectURL(blob));
    })();

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
      renderRecords();
    });

    // 當輸入台幣金額時，自動連動 TOTAL 金額
    function syncTotalWithNtd() {
      const ntdVal = document.getElementById('inputNtd').value;
      document.getElementById('inputTotal').value = ntdVal;
    }

    // 表單送出
    function handleFormSubmit(e) {
      e.preventDefault();

      const ntdRaw = document.getElementById('inputNtd').value;
      const totalRaw = document.getElementById('inputTotal').value;

      const item = {
        id: Date.now().toString(),
        category: document.getElementById('inputCategory').value,
        date: document.getElementById('inputDate').value,
        currency: document.getElementById('inputCurrency').value,
        amount: parseFloat(document.getElementById('inputAmount').value) || 0,
        cardNo: document.getElementById('inputCardNo').value.trim(),
        ntd: ntdRaw === '' ? '' : (parseFloat(ntdRaw) || 0),
        total: totalRaw === '' ? '' : (parseFloat(totalRaw) || 0),
        note: document.getElementById('inputNote').value.trim()
      };

      records.push(item);
      localStorage.setItem('receipt_records_bill', JSON.stringify(records));
      renderRecords();

      // 清空，方便填下一筆
      document.getElementById('inputAmount').value = '';
      document.getElementById('inputNtd').value = '';
      document.getElementById('inputTotal').value = '';
      document.getElementById('inputNote').value = '';
      document.getElementById('inputCardNo').value = '';

      document.getElementById('inputAmount').focus();
    }

    function renderRecords() {
      const container = document.getElementById('recordsContainer');
      document.getElementById('recordBadge').innerText = records.length;
      document.getElementById('totalCount').innerText = `${records.length} 筆`;

      if (records.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-xl p-6 text-center text-slate-400 text-xs border border-dashed">尚未登記任何明細</div>`;
        return;
      }

      container.innerHTML = records.map((r, i) => {
        let formattedDay = r.date;
        if (r.date) {
          const d = new Date(r.date);
          if (!isNaN(d.getTime())) formattedDay = `${d.getMonth() + 1}月${d.getDate()}日`;
        }

        const displayNtd = (r.ntd === '' || r.ntd === 0) ? '0' : r.ntd.toLocaleString();

        return `
          <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 flex items-center justify-between text-xs">
            <div>
              <div class="font-bold text-slate-800">#${i+1} [${r.category}] ${r.currency} $${r.amount}</div>
              <div class="text-slate-400 mt-0.5">${formattedDay} ‧ 卡號/付款: ${r.cardNo || '無'} ‧ 註: ${r.note || '無'}</div>
            </div>
            <div class="text-right">
              <div class="font-extrabold text-slate-900">NTD ${displayNtd}</div>
              <button onclick="removeRecord('${r.id}')" class="text-red-500 font-semibold text-[10px] mt-1">刪除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function removeRecord(id) {
      records = records.filter(r => r.id !== id);
      localStorage.setItem('receipt_records_bill', JSON.stringify(records));
      renderRecords();
    }

    function clearAll() {
      if (records.length && confirm('確定要清空所有已登記的明細嗎？')) {
        records = [];
        localStorage.setItem('receipt_records_bill', JSON.stringify(records));
        renderRecords();
      }
    }

    // 匯出完全對齊 Excel 格式
    function exportToExcel() {
      if (!records.length) return alert('目前沒有任何記錄可供匯出！');

      const excelData = records.map((r, index) => {
        let formattedDay = r.date;
        if (r.date) {
          const d = new Date(r.date);
          if (!isNaN(d.getTime())) {
            formattedDay = `${d.getMonth() + 1}月${d.getDate()}日`;
          }
        }

        return {
          "項次": index + 1,
          "DAY": formattedDay,
          "分類": r.category,
          "幣別": r.currency,
          "$": r.amount,
          "刷卡金額": r.amount,
          "卡號": r.cardNo,
          "NTD": r.ntd === '' ? '' : r.ntd,
          "TOTAL": r.total === '' ? '' : r.total,
          "註": r.note,
          "Check": ""
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(excelData);

      worksheet['!cols'] = [
        { wch: 6 },  // 項次
        { wch: 10 }, // DAY
        { wch: 12 }, // 分類
        { wch: 8 },  // 幣別
        { wch: 12 }, // $
        { wch: 12 }, // 刷卡金額
        { wch: 10 }, // 卡號
        { wch: 12 }, // NTD
        { wch: 12 }, // TOTAL
        { wch: 22 }, // 註
        { wch: 10 }  // Check
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "差旅核銷表");

      const today = new Date().toISOString().split('T')[0];
      XLSX.writeFile(workbook, `出差差旅費報帳明細表_${today}.xlsx`);
    }
  </script>
</body>
</html>
